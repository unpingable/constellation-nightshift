[workspace]

[package]
name = "pulse-nq-load-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[[bin]]
name = "pulse-nq-load-support"
path = "src/main.rs"
