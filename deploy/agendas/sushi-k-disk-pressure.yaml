# HISTORICAL WATCHBILL AGENDA — not a current deployment recipe.
# The current closed Nightshift runtime has no watchbill/--nq-db entrypoint.
# No production or test target loads this agenda; the commands below preserve
# the original pilot procedure and must not be used for modern integration.
# Local sushi-k dogfood agenda.
#
# Target: disk_pressure finding on sushi-k itself, via the local nq
# instance (publisher + aggregator running on this dev box). First
# named local pilot agenda — see docs/working/decisions/MILESTONE-
# 2026-05-28-first-live-dogfood.md for what this dogfood proves
# (and explicitly does not prove).
#
# Invocation (manual, advise-only, local nq):
#
#   PATH=/home/jbeck/git/notquery/target/release:$PATH \
#   nightshift \
#     --no-governor \
#     --store ~/nightshift/local.sqlite \
#     --nq-db ~/nq/nq.db \
#     watchbill run \
#     --trigger scheduled \
#     --finding 'nq:disk_pressure:sushi-k:' \
#     deploy/agendas/sushi-k-disk-pressure.yaml
#
# --trigger scheduled activates idempotency: re-running within the
# same NQ snapshot generation skips with a one-liner pointing at
# the prior run.

agenda_version: 0
agenda_id: sushi-k-disk-pressure
workflow_family: ops
owner: operator@local
cadence:
  kind: scheduled
  expr: "*/5 * * * *"
scope:
  hosts:
    - sushi-k
  services: []
  paths: []
  repos: []
artifact_target: packet
promotion_ceiling: advise
reconciler:
  required: true
  invalidates_if:
    - finding_absent_for_n_generations:1
    - host_unreachable
allowed_evidence_sources:
  - nq
  - continuity
allowed_tool_classes:
  - discover
  - read
  - propose
budget:
  max_wall_seconds: 600
  max_tokens: 100000
  max_mcp_calls: 50
governor_binding:
  required_above: observe
  policy_id: nightshift.ops.propose_only
criticality:
  class: standard
  re_alert_after: 4h
  silence_max_duration: 72h
  ack_due_by: 24h
  handoff_required: false
  business_hours_okay: true
diagnosis:
  mode: self_check
