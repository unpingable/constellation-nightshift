[package]
name = "nightshift-casework"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Read-only Nightshift packet and run-receipt casework projection"
autobins = false

[lib]
name = "nightshift_casework"
path = "src/lib.rs"

[[bin]]
name = "nightshift-casework"
path = "src/bin/nightshift_casework.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
nightshiftd = { path = "../nightshiftd" }
nightshift-foreman = { path = "../nightshift-foreman" }
nightshift-provider-capacity = { path = "../nightshift-provider-capacity" }
serde.workspace = true
rustix = { version = "1", features = ["fs"] }
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
tempfile.workspace = true
